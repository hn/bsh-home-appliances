  - platform: template
    id: hob_front_right_set_power
    name: "Hob front right set power"
    accuracy_decimals: 1
    state_class: measurement

  # ---------------------------------------------------------
  # Actual power
  # ---------------------------------------------------------

  - platform: template
    id: hob_front_left_actual_power
