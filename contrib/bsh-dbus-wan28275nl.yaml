#
# bsh-dbus-wan28275nl.yaml -- ESPHome config to interface B/S/H/ washing machine WAN28275NL
#
# Bosch Serie 4 WAN28275NL (no Home Connect), UI board BSH 8001102547 (EPW67004).
# Adapter: Bouni BSH-Board (ESP32-C6) on the spare 3-pin RAST 2.5 slot of the UI board.
# Read-only (no transmitting). Entity names are Dutch; decoding notes and
# hardware details: https://github.com/hn/bsh-home-appliances/discussions/146
#
# This file has been contributed by
# (C) 2026 Carl Megens
# https://github.com/carlmegens
#
# (C) 2024 Hajo Noerenberg
# https://www.noerenberg.de/
# https://github.com/hn/bsh-home-appliances
