esphome:
  name: bsh-dbus-cwk6r200
  friendly_name: BSH dryer CWK6R200

external_components:
  - source: github://hn/bsh-home-appliances@master
    components: [bshdbus]

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  flash_size: 4MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Lower TX power if the bus supply sags during WLAN bursts (WT47R440 needed this):
  # output_power: 10.5dB
  ap:
    ssid: "D-Bus-CWK6R200 Fallback Hotspot"
    password: !secret wifi_ap_password

captive_portal:

status_led:
  pin:
    number: GPIO6
    inverted: true

uart:
  - id: dbus_uart
    rx_pin: GPIO4
    tx_pin: GPIO5
    baud_rate: 9600

output:
  - platform: gpio
    pin:
      number: GPIO7
      inverted: true
    id: activity_led

bshdbus:
  uart_id: dbus_uart
  on_frame:
    # Uncomment to log every raw frame:
    # - logger.log:
    #     format: "frame dest 0x%02x cmd 0x%04x: %s"
    #     args: [dest, command, format_hex_pretty(message).c_str()]
    # [TX] For the optional Start/Pause buttons insert the lambda from the
    # section at the end of this file here.
    - output.turn_on: activity_led
    - delay: 20ms
    - output.turn_off: activity_led

sensor:
  - platform: bshdbus
    dest: 0x21
    command: 0x1002
    sensors:
      - id: bsh_time_remaining
        name: Time remaining
        icon: mdi:clock-outline
        unit_of_measurement: "min"
        device_class: duration
        state_class: measurement
        accuracy_decimals: 0
        # seconds, counts down once per minute while running
        lambda: return (x[0] << 8) | x[1];
        filters:
          - multiply: 0.0166667
  - platform: bshdbus
    dest: 0x11
    command: 0x1006
    sensors:
      - id: bsh_anti_crease_time
        name: Anti-crease
        icon: mdi:shield-refresh
        unit_of_measurement: "min"
        device_class: duration
        accuracy_decimals: 0
        # unsigned on this model: 0x3C = 60 min, 0xB4 = 180 min, 0 = off
        lambda: return x[1];
      - id: bsh_program_raw
        name: Programme code
        entity_category: diagnostic
        accuracy_decimals: 0
        lambda: return x[0];
  - platform: bshdbus
    dest: 0x21
    command: 0x1004
    sensors:
      # 0x1004 has sub-types: 0x05 = remaining seconds, 0x0A = per-programme value (meaning open),
      # 0x0D = sent on start. Only the 0x0A byte is exposed, as a raw diagnostic.
      - id: bsh_1004_0a_raw
        name: Unknown 0x1004 0A
        entity_category: diagnostic
        accuracy_decimals: 0
        lambda: |-
          if (x[0] != 0x0A) return NAN;
          return x[1];
        filters:
          - lambda: |-
              if (std::isnan(x)) return {};
              return x;
  - platform: bshdbus
    dest: 0x21
    command: 0x1007
    sensors:
      # class, code, service word hi, lo
      - id: bsh_fault_group
        name: Fault class
        icon: mdi:alert-circle-outline
        entity_category: diagnostic
        accuracy_decimals: 0
        lambda: return x[0];
      - id: bsh_fault_code
        name: Fault code
        icon: mdi:alert-circle-outline
        entity_category: diagnostic
        accuracy_decimals: 0
        lambda: return x[1];

binary_sensor:
  - platform: bshdbus
    dest: 0x11
    command: 0x1006
    binary_sensors:
      - id: bsh_low_heat
        name: Gentle drying
        icon: mdi:feather
        lambda: return x[6] & 4;

text_sensor:
  - platform: bshdbus
    dest: 0x21
    command: 0x1007
    text_sensors:
      # as shown on the panel: "E:" + code in decimal (code 0x1E -> E:30)
      - id: bsh_fault
        name: Fault
        icon: mdi:alert-circle-outline
        lambda: |-
          if (x.size() < 2 || x[1] == 0) return std::string("No fault");
          char b[8];
          snprintf(b, sizeof(b), "E:%02d", x[1] % 100);
          return std::string(b);
  - platform: bshdbus
    dest: 0x11
    command: 0x1006
    text_sensors:
      - id: bsh_program
        name: Drying programme
        icon: mdi:tshirt-crew-outline
        lambda: return std::to_string(x[0]);
        filters:
          - map:
            - 1 -> Baumwolle Schranktrocken Plus
            - 2 -> Baumwolle Schranktrocken
            - 3 -> Baumwolle Bügeltrocken
            - 4 -> Outdoor
            - 5 -> Handtücher
            - 6 -> Mix
            - 7 -> Zeitprogramm warm
            - 8 -> Zeitprogramm kalt
            - 10 -> Wolle finish
            - 11 -> 40 min. Schnell
            - 12 -> Hemden
            - 13 -> Pflegeleicht Bügeltrocken
            - 14 -> Pflegeleicht Schranktrocken
            - 15 -> Pflegeleicht Schranktrocken Plus
            - 17 -> Dessous
      - id: bsh_drying_goal
        name: Drying target
        icon: mdi:target
        lambda: return std::to_string(x[2]);
        filters:
          - map:
            - 0 -> Bügeltrocken
            - 2 -> Schranktrocken
            - 3 -> Schranktrocken Plus
            - 5 -> None
      - id: bsh_fine_adjust
        name: Dryness level
        icon: mdi:white-balance-sunny
        lambda: return std::to_string(x[4]);
        filters:
          - map:
            - 6 -> 0
            - 8 -> +1
            - 10 -> +2
            - 12 -> +3
  - platform: bshdbus
    dest: 0x21
    command: 0x1000
    text_sensors:
      # byte 0 = 0x29: door event, byte 1 = 0x06 closed / 0x03 open (sent on change only)
      - id: bsh_door
        name: Door
        icon: mdi:door
        lambda: |-
          if (x[0] != 0x29) return std::string();
          return std::to_string(x[1]);
        filters:
          - lambda: |-
              if (x.empty()) return {};
              return x;
          - map:
            - 3 -> Open
            - 6 -> Closed
      # other byte-0 values are machine states; 0x0C is repeated every 30 s in every state and ignored
      - id: bsh_status
        name: Status
        icon: mdi:tumble-dryer
        lambda: |-
          // only the known programme states; door (29), periodic (0C) and other
          // codes (power-on handshake, switch-off, ...) keep the last state
          switch (x[0]) {
            case 0x02: case 0x16: case 0x17: case 0x2E: case 0x31: break;
            default: return std::string();
          }
          return std::to_string(x[0]);
        filters:
          - lambda: |-
              if (x.empty()) return {};
              return x;
          - map:
            - 46 -> Starting
            - 22 -> Running
            - 23 -> Finished
            - 2 -> Ended
            - 49 -> Start not confirmed
  - platform: bshdbus
    dest: 0x11
    command: 0x1001
    text_sensors:
      - id: bsh_ready
        name: Programme control
        icon: mdi:tumble-dryer
        lambda: return std::to_string(x[0]);
        filters:
          - map:
            - 1 -> Running
            - 3 -> Ready
            # 04 = power-on hello of the UI module
            - 4 -> Power on
            - 35 -> Start requested
            - 36 -> Starting
  - platform: bshdbus
    dest: 0x21
    command: 0x1003
    text_sensors:
      - id: bsh_phase
        name: Programme phase
        icon: mdi:progress-clock
        lambda: return std::to_string(x[0]);
        filters:
          - map:
            - 5 -> Finished
            - 7 -> Finished
            - 11 -> Drying
            # second drying stage after the moisture estimate (new remaining time)
            - 12 -> Drying
            - 13 -> Finishing

# =============================================================================
# OPTIONAL: Start / Pause over the bus -- DISABLED
#
# Transmitting on the D-Bus is not recommended by this project; use at your own
# risk. Verified on a CWK6R200/05 (see the discussion): Pause sends 0x11/0x1001
# 03 00; Start replays the UI module's sequence 23 00, 24 00, waits for the
# power module's 0x21/0x1000 2E 00 and sends 01 00. Frames go out ~150 ms after
# the 0x0F/0xE000 heartbeat, when the bus is quiet. The programme is still
# selected with the knob; settings (0x1006) are not sent because the UI module
# owns the panel symbols and overwrites them.
#
# To enable:
#   1. insert the lambda below into bshdbus: on_frame: (see [TX] above)
#   2. uncomment globals:, script: and button: below
#   3. optionally add "Last sent frame" to text_sensor:
# =============================================================================
#
# --- 1. on_frame lambda -------------------------------------------------------
