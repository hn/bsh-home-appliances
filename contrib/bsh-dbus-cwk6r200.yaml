#           if (dest == 0x21 && command == 0x1000 && message.size() >= 2 && message[0] == 0x29)
#             id(door_state) = (message[1] == 0x06) ? 1 : (message[1] == 0x03 ? 0 : -1);
#           if (dest == 0x11 && command == 0x1001 && !message.empty()) {
#             id(control_state) = message[0];
#             if (message[0] == 0x01) id(seen_running_echo) = true;
#           }
#           // power module accepted the start request
#           if (dest == 0x21 && command == 0x1000 && !message.empty() && message[0] == 0x2E)
#             id(seen_starting) = true;
#           // heartbeat: the bus is quiet for ~2.5 s afterwards -> send a pending frame
#           if (dest == 0x0F && command == 0xE000 && !id(tx_pending).empty())
#             id(tx_send).execute();
#           if (dest == 0x0F && command == 0xE000 && id(start_pending)) {
#             id(start_pending) = false;
#             id(start_delay).execute();
#           }
#
# --- 2. globals / script / button -----------------------------------------
# globals:
#   - id: door_state          # -1 unknown, 0 open, 1 closed (only known after a door event)
#     type: int
#     initial_value: '-1'
#   - id: control_state       # last 0x11/0x1001 byte 0, -1 unknown
#     type: int
#     initial_value: '-1'
#   - id: tx_pending          # complete frame waiting for the next quiet gap
#     type: std::vector<uint8_t>
#   - id: start_pending       # start sequence waiting for the next quiet gap
#     type: bool
#     initial_value: 'false'
#   - id: seen_starting       # power module answered 0x1000 2E during our start sequence
#     type: bool
#     initial_value: 'false'
#   - id: seen_running_echo   # 0x11/0x1001 01 00 seen on the bus (our echo or the UI module)
#     type: bool
#     initial_value: 'false'
#
# script:
#   - id: tx_send
#     mode: single
#     then:
#       - delay: 150ms
#       - lambda: |-
#           auto &f = id(tx_pending);
#           if (f.empty()) return;
#           id(dbus_uart).write_array(f.data(), f.size());
#           ESP_LOGI("dryer_tx", "sent: %s", format_hex_pretty(f).c_str());
