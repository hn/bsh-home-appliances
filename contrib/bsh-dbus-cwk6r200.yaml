# Derived from bsh-dbus-wt47y781.yaml by Jonas Bruestel.
# Power module EPT58131 (see DRYER.md), D-Bus taken from the unused 3-pin
# RAST 2.5 header on the user interface module, adapter: Bouni BSH-Board 1.1.
#
# Verified on a CWK6R200/05 in November 2026: all 15 programme positions,
# dryness level / anti-crease / gentle drying keys, start, pause, door,
# end of a timed and of a sensor-controlled programme.
# Fault frame 0x1007 = class, code, service word (hi, lo); the panel shows
# "E:" + code in decimal, class 1 is stored only (not displayed).
# The power module also has a status block (motor, compressor, temperature)
# that needs a subscription frame; not part of this read-only file, see the
# discussion.
#
# Read-only by default. Optional Start/Pause buttons that transmit on the bus
# are included at the end of this file, commented out.
#
# WARNING: on this dryer the D-Bus is NOT isolated from mains.
