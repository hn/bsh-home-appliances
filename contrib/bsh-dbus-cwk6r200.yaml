#
#   # Same sequence the UI module sends on the start key:
#   # 0x1001 23 00, ~450 ms later 24 00, power module answers 0x1000 2E 00, then 0x1001 01 00 and 0x1005 00 00 00
#   - id: start_seq
#     mode: single
#     then:
#       - lambda: |-
#           id(seen_starting) = false;
#           id(tx_frame)->execute(std::vector<int>{0x11, 0x10, 0x01, 0x23, 0x00});
#       - delay: 450ms
#       - lambda: id(tx_frame)->execute(std::vector<int>{0x11, 0x10, 0x01, 0x24, 0x00});
#       - wait_until:
