# Model-specific evidence and limits:
# Half Load: 17/1000 byte 1 mask 0x20, physically selected; Auto code 0x0d.
# 2026-10-29 run: 20:58:43 start, 22:27:51 phase 28, 22:42:53 raw cycle 03.
# Phase 28 lasted 15m01s to phase 20; consistent with other BSH drying captures.
# 21/22/24 labels describe broad stages, not individual fill/drain/heater actions.
# 12/14 are transitions. Time and progress can move backward after these frames.
# Phase 20 alone is NOT completion. Raw cycle 03 also occurs after cancel/fault.
# Ended is not a fault-free/Clean assertion. No automatic fault mapping implemented.
# 26/2002=00000002 occurred during a completed run; do not treat it as an error.
# 25/2013 and 26/2002 change in other models' fault tests, but byte meanings unknown.
# 25/2015 is program-dependent; its option-mask interpretation is unconfirmed.
